<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Borsa Baronu Yönetim</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0a0f1e; --card: #121a30; --card2: #182241; --line: #223055;
    --text: #e8ecf7; --muted: #8e98b5; --green: #19d38a; --red: #ff5470;
    --blue: #4c8dff; --gold: #ffd23f; --purple: #b18cff; --cyan: #22d3ee;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px 16px 60px; }
  .muted { color: var(--muted); }
  .tiny { font-size: 12px; }
  .hidden { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  /* header */
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
  .brand span { color: var(--gold); }
  .hdr-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .btn { border: 1px solid var(--line); background: var(--card2); padding: 7px 12px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .btn:hover { border-color: var(--blue); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.danger { color: var(--red); }
  .btn.danger:hover { border-color: var(--red); }
  .btn.good { color: var(--green); }
  .btn:disabled { opacity: .5; cursor: default; }
  .dev-banner { background: #3a2a00; border: 1px solid #7a5a00; color: var(--gold); padding: 8px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }

  /* tabs */
  nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: none; border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 99px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
  nav button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 99px; background: var(--red); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }

  /* cards */
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .stat .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .stat .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; }
  .stat .s { font-size: 12px; color: var(--muted); }
  .stat.alert { border-color: var(--red); }
  .stat.alert .v { color: var(--red); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
  .dot.on { background: var(--green); box-shadow: 0 0 0 0 rgba(25, 211, 138, .6); animation: pulse 2s infinite; }
  .dot.today { background: var(--gold); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(25, 211, 138, .6); } 70% { box-shadow: 0 0 0 7px rgba(25, 211, 138, 0); } 100% { box-shadow: 0 0 0 0 rgba(25, 211, 138, 0); } }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 14px; }
  .panel h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel h2 .right { margin-left: auto; display: flex; gap: 6px; }
  .cols { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .cols { grid-template-columns: 1.3fr 1fr; } }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
  .seg button { border: 0; background: none; padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--card2); color: var(--text); }

  /* chart */
  .chart svg { width: 100%; height: 190px; display: block; }
  .chart .cap { font-size: 13px; color: var(--muted); min-height: 20px; margin-top: 6px; }
  .chart rect.bar { fill: var(--blue); }
  .chart rect.bar.today { fill: var(--green); }
  .chart rect.bar:hover, .chart rect.bar.sel { fill: var(--gold); }

  /* lists */
  .list { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-top: 1px solid var(--line); min-width: 0; }
  .row:first-child { border-top: 0; }
  .row.click { cursor: pointer; border-radius: 8px; }
  .row.click:hover { background: var(--card2); }
  .row .main { flex: 1; min-width: 0; }
  .row .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .end { text-align: right; flex: none; }
  .row .end .big { font-weight: 700; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 6px; background: var(--card2); border: 1px solid var(--line); font-size: 11px; font-weight: 700; color: var(--muted); margin-left: 4px; vertical-align: 1px; }
  .tag.gold { color: var(--gold); } .tag.green { color: var(--green); } .tag.red { color: var(--red); } .tag.blue { color: var(--blue); }
  .emb { font-size: 22px; width: 30px; text-align: center; flex: none; }
  .feed .row { font-size: 14px; }
  .feed .t { font-size: 12px; color: var(--muted); flex: none; width: 62px; }
  .empty { color: var(--muted); padding: 20px 4px; text-align: center; font-size: 14px; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .toolbar input, .toolbar select, .field input, .field select { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .toolbar input { flex: 1; min-width: 160px; }
  .hide-sm { }
  @media (max-width: 600px) { .hide-sm { display: none; } .stat .v { font-size: 22px; } }

  /* war */
  .war { padding: 12px 4px; border-top: 1px solid var(--line); }
  .war:first-child { border-top: 0; }
  .war .vs { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .war .vs .side { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .war .vs .side.r { justify-content: flex-end; }
  .war .score { font-size: 18px; font-variant-numeric: tabular-nums; }
  .bar2 { height: 8px; border-radius: 99px; background: var(--red); overflow: hidden; margin: 8px 0 4px; }
  .bar2 > div { height: 100%; background: var(--blue); }

  /* modal */
  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  @media (min-width: 700px) { .modal { align-items: center; } }
  .sheet { background: var(--card); border: 1px solid var(--line); width: 100%; max-width: 620px; max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px 24px; }
  @media (min-width: 700px) { .sheet { border-radius: 18px; } }
  .sheet h3 { margin: 0; font-size: 20px; }
  .sheet .close { float: right; }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin: 14px 0; }
  .kv div { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .kv b { display: block; font-size: 16px; }
  .kv span { font-size: 11px; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .mini-bars { display: flex; align-items: flex-end; gap: 2px; height: 50px; margin-top: 6px; }
  .mini-bars div { flex: 1; background: var(--blue); border-radius: 2px 2px 0 0; min-height: 1px; }

  /* event */
  .ev-now { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
  .ev-now .ic { font-size: 40px; }
  .ev-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .ev-opt { text-align: left; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; }
  .ev-opt.on { border-color: var(--gold); }
  .ev-opt b { display: block; }
  .ev-opt small { color: var(--muted); font-size: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }

  /* login */
  .login { max-width: 360px; margin: 12vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
  .login h1 { font-size: 22px; margin: 0 0 4px; }
  .login input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; margin-top: 10px; }
  .login .btn { width: 100%; margin-top: 14px; padding: 11px; font-size: 15px; }
  .err { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 18px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 60; box-shadow: 0 8px 30px rgba(0, 0, 0, .4); }
  .spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: sp 0.8s linear infinite; margin: 30vh auto 10px; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading"><div class="spin"></div><p class="muted" style="text-align:center">Yükleniyor…</p></div>

  <form class="login hidden" id="login" autocomplete="on">
    <h1>📈 Yönetim Paneli</h1>
    <p class="muted tiny">Borsa Baronu · sadece yöneticiler</p>
    <input type="email" id="email" placeholder="E-posta" autocomplete="username" required>
    <input type="password" id="pass" placeholder="Şifre" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Giriş yap</button>
    <div class="err" id="loginErr"></div>
  </form>

  <div id="app" class="hidden">
    <div class="dev-banner hidden" id="devBanner">🧪 TEST MODU: Sahte verilerle çalışıyor, gerçek oyuncular etkilenmez.</div>
    <header>
      <div class="brand">📈 Borsa Baronu <span>Yönetim</span></div>
      <div class="hdr-right">
        <span class="pill" id="updated"><span class="dot on"></span> canlı</span>
        <button class="btn" id="refresh" title="Yenile">↻ Yenile</button>
        <button class="btn" id="logout">Çıkış</button>
      </div>
    </header>
    <nav id="tabs"></nav>
    <main id="view"></main>
  </div>
</div>
<div id="modal"></div>

<script>
'use strict';
// Same public project + publishable key as the game (www/js/config.js).
// Admin data is only returned to accounts listed in the `admins` table.
const CFG = {
  url: 'https://beefevqticcwvmvdygzr.supabase.co',
  key: 'sb_publishable_oYdvMCMpIewEN83Yc5Fndg_zx27Mq6f',
};
const DEV = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).has('dev');
const REFRESH_MS = 30000;

// Mirrors EVENTS in www/js/data.js (keep in sync when adding events).
const EVENT_EPOCH = Date.UTC(2026, 0, 5);
const WEEK_MS = 7 * 86400000;
const EVENTS = [
  { key: 'ai_boom',       icon: '🤖', name: 'Yapay Zeka Çılgınlığı', desc: 'YZ ve teknoloji: temettü x2, savaş puanı x2', sp: 2, div: 2 },
  { key: 'energy_crisis', icon: '⚡', name: 'Enerji Krizi',          desc: 'Enerji: temettü x3, savaş puanı x2', sp: 2, div: 3 },
  { key: 'food_fest',     icon: '🥯', name: 'Gıda Festivali',        desc: 'Gıda: temettü x3, savaş puanı x2, sık ipucu', sp: 2, div: 3, tipFreq: 1.5 },
  { key: 'space_race',    icon: '🚀', name: 'Uzay Yarışı',           desc: 'Uzay: temettü x2, savaş puanı x2', sp: 2, div: 2 },
  { key: 'dividend_week', icon: '💰', name: 'Temettü Haftası',       desc: 'Bütün temettüler x2', allDiv: 2 },
  { key: 'bull_week',     icon: '🐂', name: 'Boğa Haftası',          desc: 'İpuçları 2 kat sık, boğa koşuları 2 kat uzun', tipFreq: 2, boostDur: 2 },
  { key: 'bear_week',     icon: '🐻', name: 'Ayı Piyasası',          desc: 'Kötü haber sık, açığa satışta savaş puanı x2', shortSp: 2 },
  { key: 'ipo_week',      icon: '🔔', name: 'Halka Arz Haftası',     desc: 'Tüm çalışanlar %25 indirimli', staffDisc: 0.25 },
];
const EV = Object.fromEntries(EVENTS.map(e => [e.key, e]));
const TIERS = { bronze: ['Bronz', '🥉'], silver: ['Gümüş', '🥈'], gold: ['Altın', '🥇'], diamond: ['Elmas', '💎'], baron: ['Baron', '👑'] };
const QUICK = { hello: 'Selam! 👋', gg: 'İyi oyundu 🤝', attack: 'Saldırıya! ⚔️', nice: 'Harika! 🔥', thanks: 'Teşekkürler 🙏',
                hurry: 'Acele edin! ⏰', profit: 'Kâr zamanı 💰', sleep: 'Uyumaya gidiyorum 😴' };

let sb = null, db = null, D = null, busy = false, timer = null;
let tab = 'overview', chartKey = 'active', chartSel = null;
let pSearch = '', pSort = 'seen', cSearch = '';
let evPick = null, evHours = 48, evStrong = false;

// ------------------------------------------------------------- helpers
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Same money suffixes as the game (www/js/ui.js).
const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  n = Number(n) || 0;
  const a = Math.abs(n);
  if (a < 1000) return String(Math.round(n));
  const k = Math.floor(Math.log10(a) / 3);
  return k < SUFFIX.length ? (n / Math.pow(1000, k)).toPrecision(3) + SUFFIX[k] : n.toExponential(2);
}
const int = n => (Number(n) || 0).toLocaleString('tr-TR');
function ago(t) {
  if (!t) return '—';
  const s = (Date.now() - Date.parse(t)) / 1000;
  if (s < 60) return 'az önce';
  if (s < 3600) return Math.floor(s / 60) + ' dk önce';
  if (s < 86400) return Math.floor(s / 3600) + ' sa önce';
  if (s < 86400 * 30) return Math.floor(s / 86400) + ' gün önce';
  return new Date(t).toLocaleDateString('tr-TR');
}
function left(t) {
  const s = (Date.parse(t) - Date.now()) / 1000;
  if (s <= 0) return 'bitti';
  if (s < 3600) return Math.ceil(s / 60) + ' dk kaldı';
  if (s < 86400) return Math.floor(s / 3600) + ' sa ' + Math.floor(s % 3600 / 60) + ' dk kaldı';
  return Math.floor(s / 86400) + ' gün ' + Math.floor(s % 86400 / 3600) + ' sa kaldı';
}
function dur(sec) {
  sec = Number(sec) || 0;
  if (sec < 60) return sec > 0 ? '<1 dk' : '0 dk';
  const m = Math.round(sec / 60);
  return m < 60 ? m + ' dk' : Math.floor(m / 60) + ' sa ' + (m % 60) + ' dk';
}
const dayLabel = d => new Date(d + 'T12:00:00').toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
const status = p => (Date.now() - Date.parse(p.last_seen)) < 300000 ? 'on' : (p.today_s > 0 || (Date.now() - Date.parse(p.last_seen)) < 86400000) ? 'today' : '';
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
const ERRORS = {
  NOT_ADMIN: 'Bu hesap yönetici değil. README › "Yönetim paneli" adımlarına bak.',
  PLAYER_NOT_FOUND: 'Oyuncu bulunamadı (silinmiş olabilir).',
};
const errText = e => { const m = (e && (e.message || e.msg)) || String(e); return ERRORS[m] || m; };

// ------------------------------------------------------------- data access
async function rpc(name, args = {}) {
  if (!DEV) {
    const { data, error } = await sb.rpc(name, args);
    if (error) throw error;
    return data;
  }
  await db.query("select set_config('app.uid', $1, false)", [DEV_ADMIN]);
  const keys = Object.keys(args);
  const res = await db.query(`select public.${name}(${keys.map((k, i) => `${k} => $${i + 1}`).join(', ')}) as r`,
    keys.map(k => args[k] !== null && typeof args[k] === 'object' ? JSON.stringify(args[k]) : args[k]));
  return res.rows[0].r;
}

async function load(quiet) {
  if (busy) return;
  busy = true;
  try {
    D = await rpc('bb_admin_dashboard');
    $('updated').innerHTML = '<span class="dot on"></span> ' + new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    render();
  } catch (e) {
    if (errText(e) === ERRORS.NOT_ADMIN && !DEV) { await sb.auth.signOut(); showLogin(ERRORS.NOT_ADMIN); }
    else if (!quiet) toast('Hata: ' + errText(e));
    else $('updated').innerHTML = '<span class="dot"></span> bağlantı yok';
  } finally { busy = false; }
}

function startTimer() {
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden && !$('modal').innerHTML) load(true); }, REFRESH_MS);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && D) load(true); });

// ------------------------------------------------------------- render
const TABS = [
  ['overview', '📊 Genel'], ['players', '👤 Oyuncular'], ['clans', '🛡️ Klanlar'],
  ['wars', '⚔️ Savaşlar'], ['reports', '🚩 Şikayetler'], ['events', '🎉 Etkinlik'],
];
function render() {
  const open = D.stats.reports_open;
  const act = D.wars.filter(w => w.status === 'active').length;
  $('tabs').innerHTML = TABS.map(([k, l]) =>
    `<button class="${tab === k ? 'on' : ''}" data-tab="${k}">${l}${k === 'reports' && open ? `<span class="badge">${open}</span>` : ''}${k === 'wars' && act ? `<span class="badge" style="background:var(--blue)">${act}</span>` : ''}</button>`).join('');
  const f = { overview: vOverview, players: vPlayers, clans: vClans, wars: vWars, reports: vReports, events: vEvents }[tab];
  const keep = document.activeElement && document.activeElement.id;
  const pos = keep && document.activeElement.selectionStart;
  $('view').innerHTML = f();
  if (keep && $(keep)) { $(keep).focus(); try { $(keep).setSelectionRange(pos, pos); } catch (e) {} }
}

function statCard(k, v, s, cls = '') {
  return `<div class="stat ${cls}"><div class="k">${k}</div><div class="v num">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
}

function vOverview() {
  const s = D.stats;
  const avg = s.today ? Math.round(s.minutes_today / s.today) : 0;
  const clanPct = s.players ? Math.round(100 * s.in_clan / s.players) : 0;
  const online = D.players.filter(p => status(p) === 'on');
  return `
    <div class="grid">
      ${statCard('<span class="dot on"></span> Şu an oyunda', int(s.online), 'son 5 dakikada')}
      ${statCard('📅 Bugün oynayan', int(s.today), `${int(s.new_today)} yeni oyuncu`)}
      ${statCard('🗓️ Son 7 gün', int(s.week), 'farklı oyuncu')}
      ${statCard('👥 Toplam oyuncu', int(s.players), `%${clanPct} bir klanda`)}
      ${statCard('⏱️ Bugünkü oynama', dur(s.minutes_today * 60), `oyuncu başı ort. ${dur(avg * 60)}`)}
      ${statCard('🛡️ Klanlar', int(s.clans), `${int(s.in_clan)} üye`)}
      ${statCard('⚔️ Savaşlar', int(s.wars_active), `devam ediyor · ${int(s.wars_done)} bitti`)}
      ${statCard('🚩 Açık şikayet', int(s.reports_open), s.reports_open ? '24 saat içinde bak!' : 'her şey temiz', s.reports_open ? 'alert' : '')}
    </div>
    <div class="cols">
      <div class="panel chart">
        <h2>Son 30 gün
          <span class="right"><span class="seg">
            ${[['active', 'Oynayan'], ['new', 'Yeni'], ['minutes', 'Süre']].map(([k, l]) => `<button class="${chartKey === k ? 'on' : ''}" data-chart="${k}">${l}</button>`).join('')}
          </span></span>
        </h2>
        ${chart()}
      </div>
      <div class="panel">
        <h2><span class="dot on"></span> Şu an oyunda <span class="muted tiny">(${online.length})</span></h2>
        <div class="list">${online.length ? online.slice(0, 12).map(playerRow).join('') : '<div class="empty">Şu an kimse oynamıyor</div>'}</div>
      </div>
    </div>

function chart() {
  const days = D.days || [];
  const vals = days.map(d => Number(d[chartKey]) || 0);
  const max = Math.max(1, ...vals);
  const W = 600, H = 170, pad = 22, bw = (W - pad) / Math.max(1, days.length);
  const unit = { active: 'oyuncu', new: 'yeni oyuncu', minutes: '' }[chartKey];
  const bars = days.map((d, i) => {
    const h = Math.max(vals[i] ? 3 : 1, (H - 26) * vals[i] / max);
    const x = pad + i * bw + 1.5, y = H - 16 - h;
    const lab = chartKey === 'minutes' ? dur(vals[i] * 60) : `${int(vals[i])} ${unit}`;
    return `<rect class="bar ${i === days.length - 1 ? 'today' : ''} ${chartSel === i ? 'sel' : ''}" data-bar="${i}" x="${x}" y="${y}" width="${Math.max(2, bw - 3)}" height="${h}" rx="2"><title>${dayLabel(d.day)}: ${lab}</title></rect>`
      + (i % 5 === (days.length - 1) % 5 ? `<text x="${x + bw / 2 - 1.5}" y="${H - 2}" fill="#8e98b5" font-size="10" text-anchor="middle">${dayLabel(d.day)}</text>` : '');
  }).join('');
  const maxLab = chartKey === 'minutes' ? dur(max * 60) : int(max);
  const sel = chartSel != null && days[chartSel];
  const cap = sel ? `<b>${dayLabel(sel.day)}</b>: ${int(sel.active)} oynayan · ${int(sel.new)} yeni · ${dur(sel.minutes * 60)} oynama`
                  : `Toplam: ${chartKey === 'minutes' ? dur(vals.reduce((a, b) => a + b, 0) * 60) : int(vals.reduce((a, b) => a + b, 0))} · bir çubuğa dokun`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="${pad}" x2="${W}" y1="10" y2="10" stroke="#223055" stroke-dasharray="3 4"/>
      <text x="0" y="14" fill="#8e98b5" font-size="10">${maxLab}</text>
      <line x1="${pad}" x2="${W}" y1="${H - 16}" y2="${H - 16}" stroke="#223055"/>
      ${bars}</svg><div class="cap">${cap}</div>`;
}

    case 'challenge_out': return `📨 ${a}, ${other} klanına meydan okudu`;

function currentEvent() {
  const live = D.events.find(e => e.live && EV[e.key]);
  if (live) return { ...EV[live.key], id: live.id, ends: live.ends_at, config: live.config, server: true };
  const idx = Math.floor((Date.now() - EVENT_EPOCH) / WEEK_MS);
  const e = EVENTS[((idx % EVENTS.length) + EVENTS.length) % EVENTS.length];
  return { ...e, ends: new Date(EVENT_EPOCH + (idx + 1) * WEEK_MS).toISOString(), server: false };
}
function eventConfig(e, strong) {
  if (!strong) return {};
  const c = {};
  if (e.sp) c.spMult = e.sp * 2;
  if (e.div) c.div = e.div * 2;
  if (e.allDiv) c.allDiv = e.allDiv * 2;
  if (e.tipFreq) c.tipFreq = e.tipFreq * 2;
  if (e.boostDur) c.boostDur = e.boostDur * 2;
  if (e.shortSp) c.shortSp = e.shortSp * 2;
  if (e.staffDisc) c.staffDisc = 0.5;
  return c;
}

    ${wars.length ? `<h3 style="font-size:15px;margin-top:14px">Savaşlar</h3>${wars.map(warBlock).join('')}` : ''}
    <div class="actions">
      <button class="btn" data-act="rename_clan" data-id="${esc(c.id)}" data-name="${esc(c.name)}">✏️ Adını sıfırla</button>
      <button class="btn danger" data-act="delete_clan" data-id="${esc(c.id)}" data-name="${esc(c.name)}">🗑️ Klanı sil</button>
    </div>`);
}

// ------------------------------------------------------------- actions
const CONFIRM = {
  resolve_report: () => null,
  rename_player: n => `"${n}" adlı oyuncunun adı "Oyuncu_XXXX" olarak sıfırlansın mı?`,
  delete_player: n => `"${n}" adlı oyuncunun hesabı KALICI olarak silinsin mi?\n\nKlanından çıkar, bulut kaydı silinir. Geri alınamaz.`,
  rename_clan: n => `"${n}" klanının adı ve etiketi rastgele bir adla sıfırlansın mı?`,
  delete_clan: n => `"${n}" klanı KALICI olarak silinsin mi?\n\nÜyeler klansız kalır, savaş geçmişi silinir. Geri alınamaz.`,
  stop_event: n => `"${n}" etkinliği şimdi durdurulsun mu? Oyun otomatik haftalık etkinliğe döner.`,
};
const DONE = { resolve_report: 'Şikayet kapatıldı', rename_player: 'Oyuncunun adı sıfırlandı', delete_player: 'Hesap silindi',
               rename_clan: 'Klanın adı sıfırlandı', delete_clan: 'Klan silindi', stop_event: 'Etkinlik durduruldu', start_event: 'Etkinlik başladı 🎉' };
async function act(action, target, name, data) {
  const q = CONFIRM[action] && CONFIRM[action](name);
  if (q && !confirm(q)) return;
  try {
    await rpc('bb_admin_act', { p_action: action, p_target: target == null ? null : String(target), p_data: data || null });
    toast(DONE[action] || 'Tamam');
    $('modal').innerHTML = '';
    await load();
  } catch (e) { toast('Hata: ' + errText(e)); }
}

// ------------------------------------------------------------- events
document.addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-chart],[data-bar],[data-player],[data-clan],[data-act],[data-ev],[data-close],#evStart');
  if (!el) return;
  if (el.dataset.close) { if (e.target === el) $('modal').innerHTML = ''; return; }
  if (el.dataset.tab) { tab = el.dataset.tab; chartSel = null; render(); window.scrollTo(0, 0); }
  else if (el.dataset.chart) { chartKey = el.dataset.chart; render(); }
  else if (el.dataset.bar) { chartSel = +el.dataset.bar === chartSel ? null : +el.dataset.bar; render(); }
  else if (el.dataset.player) openPlayer(el.dataset.player);
  else if (el.dataset.clan) openClan(el.dataset.clan);
  else if (el.dataset.act) act(el.dataset.act, el.dataset.id, el.dataset.name);
  else if (el.dataset.ev) { evPick = el.dataset.ev; render(); }
  else if (el.id === 'evStart' && evPick) {
    const ev = EV[evPick];
    const h = { 6: '6 saat', 24: '1 gün', 48: '2 gün', 72: '3 gün', 168: '1 hafta' }[evHours] || evHours + ' saat';
    if (!confirm(`${ev.icon} ${ev.name} ${h} boyunca${evStrong ? ' (2 kat güçlü)' : ''} başlasın mı?\n\nTüm oyunculara hemen yansır.`)) return;
    const key = evPick;
    evPick = null;
    act('start_event', null, null, { key, hours: evHours, config: eventConfig(ev, evStrong) });
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'pSearch') { pSearch = e.target.value; render(); }
  if (e.target.id === 'cSearch') { cSearch = e.target.value; render(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'pSort') { pSort = e.target.value; render(); }
  if (e.target.id === 'evHours') evHours = +e.target.value;
  if (e.target.id === 'evStrong') evStrong = e.target.value === '1';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').innerHTML = ''; });
$('refresh').onclick = () => load();

// ------------------------------------------------------------- auth + boot
function showLogin(msg) {
  $('loading').classList.add('hidden');
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('loginErr').textContent = msg || '';
}
async function showApp() {
  $('login').classList.add('hidden');
  $('loading').classList.remove('hidden');
  await load();
  if (!D) return;
  $('loading').classList.add('hidden');
  $('app').classList.remove('hidden');
  startTimer();
}
$('login').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
  if (error) { $('loginErr').textContent = /invalid/i.test(error.message) ? 'E-posta veya şifre yanlış.' : error.message; return; }
  $('pass').value = '';
  showApp();
});
$('logout').onclick = async () => {
  clearInterval(timer);
  if (DEV) return toast('Test modunda çıkış yok');
  await sb.auth.signOut();
  D = null;
  showLogin();
};

let DEV_ADMIN = null;
async function boot() {
  if (DEV) return bootDev();
  sb = supabase.createClient(CFG.url, CFG.key);
  const { data } = await sb.auth.getSession();
  if (data.session && !data.session.user.is_anonymous) showApp(); else showLogin();
}

// Local test mode (localhost/?dev=1): the real schema.sql in PGlite with fake players.
async function bootDev() {
  $('devBanner').classList.remove('hidden');
  const { PGlite } = await import('https://cdn.jsdelivr.net/npm/@electric-sql/pglite/dist/index.js');
  db = new PGlite();
  await db.waitReady;
  const base = new URL('../../supabase/', location.href);
  await db.exec(await (await fetch(new URL('dev-auth-stub.sql', base))).text());
  await db.exec(await (await fetch(new URL('schema.sql', base))).text());
  DEV_ADMIN = crypto.randomUUID();
  await db.exec(seedSql(DEV_ADMIN));
  showApp();
}
function seedSql(admin) {
  const R = Math.random, pick = a => a[Math.floor(R() * a.length)], U = () => crypto.randomUUID();
  const names = ['musti', 'KurtTrader', 'Boğa_Ali', 'AyşeYatırım', 'Hisseci42', 'BorsaKralı', 'Mert.x', 'ZeynepFX', 'CanTrader', 'Deniz_07',
    'Ela', 'Baron_Emre', 'KaanBull', 'Selin.inv', 'OnurShort', 'Burak_TR', 'EceStock', 'Yusuf99', 'Merve_Trade', 'Tolga', 'CemBear', 'İrem',
    'Kerem.Q', 'Nazlı', 'Arda_B', 'Seda', 'Umut_X', 'Gizem', 'Oğuz', 'Pelin', 'Bora', 'Ceren', 'EfeTrader', 'Duru', 'Alp34', 'Sude'];
  const clans = [['Aslanlar', 'MUS', '🦁'], ['Kurt Sürüsü', 'KRT', '🐺'], ['Boğalar', 'BOGA', '🐂'], ['Ayı Avcıları', 'AYI', '🐻'], ['Elmas Eller', 'TMT', '💎'], ['Roketçiler', 'RKT', '🚀']];
  const P = names.map((n, i) => {
    const age = R() * 26, seen = i < 5 ? R() * 3 : i < 14 ? R() * 600 : R() * 1440 * Math.min(age, 6);
    return { id: U(), n, age, seen, total: Math.pow(10, 4 + R() * 10), clan: i < 30 ? i % clans.length : null };
  });
  const C = clans.map(([n, t, e], i) => ({ id: U(), n, t, e, leader: P.find(p => p.clan === i).id, tr: Math.floor(R() * 700), xp: Math.floor(R() * 60000) }));
  const q = [];
  q.push(`insert into auth.users (id) values ('${admin}');`, `insert into public.admins (user_id, email) values ('${admin}', 'test@ornek.com');`);
  q.push(`insert into public.meta (key, value) values ('season', public.bb__season()), ('mm_at', (now() + interval '1 year')::text);`);
  q.push(`insert into auth.users (id) values ${P.map(p => `('${p.id}')`).join(',')};`);
  q.push(`insert into public.clans (id, name, tag, emblem, leader_id, trophies, xp, wins, losses, draws, auto_war, open, created_at) values ${C.map((c, i) =>
    `('${c.id}', '${c.n}', '${c.t}', '${c.e}', '${c.leader}', ${c.tr}, ${c.xp}, ${Math.floor(R() * 20)}, ${Math.floor(R() * 12)}, ${Math.floor(R() * 3)}, ${i % 2 === 0}, ${i !== 3}, now() - interval '${Math.floor(10 + R() * 14)} days')`).join(',')};`);
  q.push(`insert into public.players (id, name, clan_id, role, total_earned, net_worth, income, rep, week_key, week_base, week_sp, sp_total, last_report, last_seen, joined_at, created_at) values ${P.map(p =>
    `('${p.id}', '${p.n}', ${p.clan == null ? 'null' : `'${C[p.clan].id}'`}, '${p.clan != null && C[p.clan].leader === p.id ? 'leader' : 'member'}', ${p.total}, ${p.total * 0.6}, ${p.total / 2000}, ${Math.floor(Math.sqrt(p.total / 1e7))},
      public.bb__week(), ${p.total * 0.7}, ${Math.floor(R() * 900)}, ${Math.floor(R() * 5000)}, now() - interval '${p.seen} minutes', now() - interval '${p.seen} minutes', now() - interval '${p.age * 0.8} days', now() - interval '${p.age} days')`).join(',')};`);
  const days = [];
  for (const p of P) for (let d = Math.floor(p.age); d >= 0; d--) {
    if (d === 0 ? p.seen < 1440 : R() < 0.55) days.push(`(public.bb__day(now()) - ${d}, '${p.id}', ${Math.floor(300 + R() * 4800)}, ${Math.floor(R() * 200)})`);
  }
  q.push(`insert into public.player_days (day, player_id, seconds, sp) values ${days.join(',')} on conflict do nothing;`);
  const war = (a, b, st, extra) => `insert into public.wars (clan_a, clan_b, status, duration_min, created_at, start_at, end_at, score_a, score_b, winner, league) values ('${C[a].id}', '${C[b].id}', '${st}', ${extra});`;
  q.push(war(0, 1, 'active', `240, now() - interval '2 hours', now() - interval '2 hours', now() + interval '2 hours', 1840, 1520, null, false`));
  q.push(war(2, 4, 'active', `480, now() - interval '1 hour', now() - interval '1 hour', now() + interval '7 hours', 610, 790, null, true`));
  q.push(war(3, 5, 'pending', `60, now() - interval '20 minutes', null, null, 0, 0, null, false`));
  q.push(war(0, 2, 'finished', `120, now() - interval '1 day', now() - interval '1 day', now() - interval '22 hours', 2310, 1790, '${C[0].id}', false`));
  q.push(war(1, 3, 'finished', `60, now() - interval '2 days', now() - interval '2 days', now() - interval '47 hours', 880, 880, null, true`));
  const ev = (c, k, who, d, mins) => `('${C[c].id}', '${k}', ${who ? `'${who}'` : 'null'}, ${d ? `'${JSON.stringify(d)}'` : 'null'}, now() - interval '${mins} minutes')`;
  const E = [];
  for (let i = 0; i < 26; i++) {
    const c = Math.floor(R() * C.length), who = pick(P.filter(p => p.clan === c)).n, o = C[(c + 1) % C.length], mins = Math.floor(R() * 2800);
    const k = pick(['joined', 'msg', 'msg', 'milestone', 'war_win', 'war_start', 'challenge_out', 'left']);
    const d = k === 'msg' ? { m: pick(Object.keys(QUICK)) } : k === 'milestone' ? { v: Math.pow(10, 6 + 3 * Math.floor(R() * 3)) }
            : k.startsWith('war') || k === 'challenge_out' ? { name: o.n, tag: o.t, emblem: o.e, us: Math.floor(R() * 2000), them: Math.floor(R() * 1500) } : null;
    E.push(ev(c, k, k.startsWith('war') ? null : who, d, mins));
  }
  q.push(`insert into public.clan_events (clan_id, kind, actor, data, created_at) values ${E.join(',')};`);
  q.push(`insert into public.reports (reporter, target_player, target_clan, reason, created_at, resolved_at) values
    ('${P[3].id}', '${P[17].id}', null, 'Uygunsuz isim', now() - interval '3 hours', null),
    ('${P[8].id}', null, '${C[3].id}', 'Klan adı hakaret içeriyor', now() - interval '40 minutes', null),
    ('${P[1].id}', '${P[22].id}', null, '', now() - interval '2 days', now() - interval '1 day');`);
  q.push(`insert into public.events (key, starts_at, ends_at, config) values ('dividend_week', now() - interval '12 days', now() - interval '10 days', '{}');`);
  return q.join('\n');
}

boot().catch(e => { console.error(e); showLogin('Bağlanamadı: ' + errText(e)); });
